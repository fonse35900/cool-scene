<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 92" width="360" height="92" role="img" aria-label="KYRGA">
  <!-- Emblem: 4-fold interlocking pinwheel -->
  <g fill="none" stroke="#2348E8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(0 46 46)"><path d="M34 46 L34 30 A 8 8 0 0 1 50 30 L50 41"/></g>
    <g transform="rotate(90 46 46)"><path d="M34 46 L34 30 A 8 8 0 0 1 50 30 L50 41"/></g>
    <g transform="rotate(180 46 46)"><path d="M34 46 L34 30 A 8 8 0 0 1 50 30 L50 41"/></g>
    <g transform="rotate(270 46 46)"><path d="M34 46 L34 30 A 8 8 0 0 1 50 30 L50 41"/></g>
  </g>

  <!-- Divider -->
  <line x1="98" y1="24" x2="98" y2="68" stroke="#2348E8" stroke-width="1.5" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="116" y="52" font-family="'Jost','Century Gothic',Arial,sans-serif" font-size="34" font-weight="500" letter-spacing="8" fill="#F5F7FA">KYRGA</text>
  <text x="118" y="70" font-family="'Jost',Arial,sans-serif" font-size="8" letter-spacing="1.8" fill="#8892A6">AUTOMOTIVE SALES MGMT SOFTWARE</text>
</svg>
